
name: Smart Campus CI Pipeline

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'Assignment-4/**'
      - '.github/workflows/**'
  pull_request:
    branches:
      - master
      - main
    paths:
      - 'Assignment-4/**'
      - '.github/workflows/**'

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Assignment-4/backend/requirements.txt
          pip install pytest

      - name: Run automated tests
        run: python -m pytest -v Assignment-4/tests

      - name: Build Docker image
        run: docker build -t smart-campus-app:ci Assignment-4
